name: Build and Release OnionVPN

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.4'
        cache-dependency-path: go.sum

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Add Go bin to PATH
      shell: pwsh
      run: echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # -------------------------------------------------------------
    # СКАЧИВАНИЕ И СБОРКА СТРУКТУРЫ ДЛЯ EMBED
    # -------------------------------------------------------------
    - name: Prepare Binaries Directory
      shell: pwsh
      run: |
        $baseDir = "internal/tor/bin/windows"
        if (Test-Path $baseDir) { Remove-Item -Recurse -Force $baseDir }
        New-Item -ItemType Directory -Force -Path $baseDir

        Write-Host "Скачивание Tor Expert Bundle..."
        $torUrl = "https://archive.torproject.org/tor-package-archive/torbrowser/15.0.19/tor-expert-bundle-windows-x86_64-15.0.19.tar.gz"
        Invoke-WebRequest -Uri $torUrl -OutFile "tor-expert.tar.gz"
        tar -f tor-expert.tar.gz -x -C $baseDir

        Write-Host "Скачивание sing-box..."
        $sbUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.13.15/sing-box-1.13.15-windows-amd64.zip"
        Invoke-WebRequest -Uri $sbUrl -OutFile "sing-box.zip"
        Expand-Archive -Path "sing-box.zip" -DestinationPath "sb_temp"
        Move-Item "sb_temp/sing-box-1.13.15-windows-amd64/sing-box.exe" "$baseDir/sing-box.exe"

        Write-Host "Скачивание wintun..."
        $wintunUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
        Invoke-WebRequest -Uri $wintunUrl -OutFile "wintun.zip"
        Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_temp"
        Move-Item "wintun_temp/wintun/bin/amd64/wintun.dll" "$baseDir/wintun.dll"

        Remove-Item -Recurse -Force sb_temp, wintun_temp, sing-box.zip, wintun.zip, tor-expert.tar.gz
        Write-Host "Структура успешно воссоздана!"

    # -------------------------------------------------------------
    # СБОРКА UPDATER — ОБЯЗАТЕЛЬНО ДО wails build (//go:embed)
    # -------------------------------------------------------------
    - name: Build updater
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path internal/updater/bin/windows | Out-Null
        go build -trimpath -ldflags "-s -w" -o internal/updater/bin/windows/OnionVPNUpdater.exe ./cmd/updater
        if (-not (Test-Path "internal/updater/bin/windows/OnionVPNUpdater.exe")) {
          Write-Error "updater.exe was not built"
          exit 1
        }
        Write-Host "Updater built successfully"

    # -------------------------------------------------------------
    # СБОРКА ПРОЕКТА ЧЕРЕЗ WAILS
    # -------------------------------------------------------------
    - name: Build Wails App
      run: wails build -clean -platform windows/amd64

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: build/bin/OnionVPN.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}